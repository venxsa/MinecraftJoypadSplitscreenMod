// Forge 1.8.9 build (ForgeGradle 2.1).
// Requires JDK 8. Tested setup: Gradle 4.5 (see .github/workflows/build.yml).
buildscript {
    repositories {
        // jcenter() is gone, so everything resolves from Maven Central + the Forge maven (HTTPS).
        mavenCentral()
        maven { name = "forge"; url = "https://files.minecraftforge.net/maven" }
        maven { name = "forge-new"; url = "https://maven.minecraftforge.net" }
        // mirror of the Forge maven, used as a fallback for the ForgeGradle plugin itself
        maven { name = "neoforged"; url = "https://maven.neoforged.net/releases" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'
//Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
}

version = "1.8.9-1.0.0"
group = "com.shiny.joypadmod"
archivesBaseName = "JoypadMod"

sourceCompatibility = targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"

    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = "stable_22"
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
}

configurations {
    shade
    compile.extendsFrom shade
}

dependencies {
    // LWJGL (which provides org.lwjgl.input.Controllers) is already part of Minecraft 1.8.9,
    // so it is no longer shaded into the mod jar.
    // JXInput is the XInput wrapper; it is JNI based and bundles its own natives.
    shade 'com.github.strikerx3:jxinput:master-SNAPSHOT'
}

jar {
    configurations.shade.each { dep ->
        from(project.zipTree(dep)){
            exclude 'META-INF', 'META-INF/**'
        }
    }
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

sourceSets {
    main.compileClasspath += configurations.shade
    main.runtimeClasspath += configurations.shade
}
